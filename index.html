<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>大東亜戦術ボードゲーム</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #1a1a1a;
      color: #fff;
      text-align: center;
      margin: 0;
      padding: 15px;
    }

    #game-container {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 20px;
      margin-top: 15px;
    }

    /* 14x14ボード */
    #board {
      display: grid;
      grid-template-columns: repeat(14, 42px);
      grid-template-rows: repeat(14, 42px);
      gap: 1px;
      background-color: #444;
      border: 3px solid #666;
    }

    .cell {
      width: 42px;
      height: 42px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-size: 8px;
      font-weight: bold;
      cursor: pointer;
      user-select: none;
      box-sizing: border-box;
      position: relative;
    }

    /* マス目の属性色（縦向き：0~2連合陸 / 3~10海 / 11~13軸心陸） */
    .cell.land-allies { background-color: #4a2c2c; } 
    .cell.sea { background-color: #1a3a5c; }         
    .cell.land-axis { background-color: #2c4a2c; }   

    /* 視界外（戦場の霧） */
    .cell.fog {
      background-color: #111 !important;
      opacity: 0.8;
    }

    .cell.selected { border: 2px solid #ffc107; z-index: 10; }

    /* ユニット表示 */
    .unit {
      width: 90%;
      padding: 1px;
      border-radius: 3px;
      color: white;
      font-size: 8px;
      line-height: 1.1;
      text-align: center;
    }
    .unit.axis { background-color: #b22222; }   /* 軸心国: 赤 */
    .unit.allies { background-color: #1e90ff; } /* 連合国: 青 */
    .unit.unknown { background-color: #555; }  /* 未確認敵機 */

    #controls {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #hand {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 200px;
      min-height: 200px;
      background-color: #2a2a2a;
      border: 1px solid #444;
      padding: 10px;
      border-radius: 8px;
    }

    .card {
      padding: 8px;
      border: 1px solid #555;
      border-radius: 5px;
      background-color: #3a3a3a;
      cursor: pointer;
      font-size: 11px;
      text-align: left;
    }
    .card.selected { background-color: #5a4a1a; border-color: #ffc107; }

    .status-text {
      font-weight: bold;
      font-size: 1.2em;
    }
    .axis-text { color: #ff6b6b; }
    .allies-text { color: #64b5f6; }
  </style>
</head>
<body>

  <h1>大東亜戦術ボードゲーム (14x14)</h1>
  <div id="game-info">
    <p>現在のターン: <span id="current-turn" class="status-text axis-text">軸心国 (Axis)</span></p>
    <p style="color: #aaa; font-size: 0.85em;">※自分のユニットから半径2マス以内のみ視界が通ります</p>
  </div>

  <div id="game-container">
    <div id="board"></div>
    <div id="controls">
      <h3>手札 (<span id="hand-owner">軸心国</span>)</h3>
      <div id="hand"></div>
    </div>
  </div>

  <script>
    // ユニットパラメータ設定
    const CARD_TYPES = [
      { name: "歩兵",       type: "land", hp: 20, maxHp: 20, atk: 10 },
      { name: "軽戦車",     type: "land", hp: 30, maxHp: 30, atk: 15 },
      { name: "中戦車",     type: "land", hp: 45, maxHp: 45, atk: 25 },
      { name: "重戦車",     type: "land", hp: 70, maxHp: 70, atk: 40 },
      { name: "戦術爆撃機", type: "air",  hp: 25, maxHp: 25, atk: 10 },
      { name: "戦闘爆撃機", type: "air",  hp: 25, maxHp: 25, atk: 15 },
      { name: "戦艦",       type: "sea",  hp: 50, maxHp: 50, atk: 20 }
    ];

    let currentTurn = "axis";
    let board = Array(14).fill(null).map(() => Array(14).fill(null));
    let hands = { axis: [], allies: [] };
    let selectedHandIndex = null;
    let selectedBoardPos = null;

    function initGame() {
      for (let i = 0; i < 3; i++) {
        hands.axis.push(getRandomCard());
        hands.allies.push(getRandomCard());
      }
      render();
    }

    function getRandomCard() {
      const rand = Math.floor(Math.random() * CARD_TYPES.length);
      return { ...CARD_TYPES[rand] };
    }

    // 視界（Fog of War）計算：自軍ユニットから2マス以内か判別
    function isVisible(r, c, owner) {
      for (let br = 0; br < 14; br++) {
        for (let bc = 0; bc < 14; bc++) {
          const unit = board[br][bc];
          if (unit && unit.owner === owner) {
            // Chebyshev距離（周囲2マス）
            if (Math.max(Math.abs(br - r), Math.abs(bc - c)) <= 2) {
              return true;
            }
          }
        }
      }
      return false;
    }

    function render() {
      const turnEl = document.getElementById("current-turn");
      turnEl.innerText = currentTurn === "axis" ? "軸心国 (Axis)" : "連合国 (Allies)";
      turnEl.className = `status-text ${currentTurn}-text`;

      document.getElementById("hand-owner").innerText = currentTurn === "axis" ? "軸心国" : "連合国";
      renderBoard();
      renderHand();
    }

    function renderBoard() {
      const boardEl = document.getElementById("board");
      boardEl.innerHTML = "";

      for (let r = 0; r < 14; r++) {
        for (let c = 0; c < 14; c++) {
          const cell = document.createElement("div");
          cell.classList.add("cell");

          // マス目属性 (14x14 : 0~2連合陸 / 3~10海 / 11~13軸心陸)
          if (r <= 2) cell.classList.add("land-allies");
          else if (r >= 11) cell.classList.add("land-axis");
          else cell.classList.add("sea");

          // 索敵（視界）の適応
          const visible = isVisible(r, c, currentTurn);
          if (!visible) {
            cell.classList.add("fog");
          }

          if (selectedBoardPos && selectedBoardPos.r === r && selectedBoardPos.c === c) {
            cell.classList.add("selected");
          }

          const unit = board[r][c];
          if (unit) {
            // 自分のユニット、または視界内の敵ユニットを表示
            if (unit.owner === currentTurn || visible) {
              const unitEl = document.createElement("div");
              unitEl.classList.add("unit", unit.owner);
              
              let name = unit.name;
              if (unit.type === "land" && r >= 3 && r <= 10) name = "輸送船";

              // 敵ユニットなら情報隠蔽（視界内でも相手の詳細が見えないようにしたい場合はここを調整）
              if (unit.owner !== currentTurn) {
                unitEl.innerHTML = `<div>${name}</div><div>HP:${unit.hp}</div>`;
              } else {
                unitEl.innerHTML = `<div>${name}</div><div>${unit.hp}/${unit.atk}</div>`;
              }
              cell.appendChild(unitEl);
            }
          }

          cell.onclick = () => handleCellClick(r, c);
          boardEl.appendChild(cell);
        }
      }
    }

    function renderHand() {
      const handEl = document.getElementById("hand");
      handEl.innerHTML = "";

      hands[currentTurn].forEach((card, index) => {
        const cardEl = document.createElement("div");
        cardEl.classList.add("card");
        if (selectedHandIndex === index) cardEl.classList.add("selected");
        cardEl.innerHTML = `<strong>[${card.name}]</strong><br>HP: ${card.hp} / ATK: ${card.atk}`;
        cardEl.onclick = () => {
          selectedHandIndex = index;
          selectedBoardPos = null;
          render();
        };
        handEl.appendChild(cardEl);
      });
    }

    function handleCellClick(r, c) {
      const isCoast = (currentTurn === "axis" && r === 10) || (currentTurn === "allies" && r === 3);
      const isOwnLand = (currentTurn === "axis" && r >= 11) || (currentTurn === "allies" && r <= 2);

      // 【1. 配置】
      if (selectedHandIndex !== null) {
        const card = hands[currentTurn][selectedHandIndex];
        if (board[r][c] !== null) { alert("既にユニットが存在します"); return; }

        if (card.type === "land" && !isOwnLand) { alert("陸上ユニットは自軍の陸地にしか配置できません"); return; }
        if (card.type === "sea" && !isCoast) { alert("海軍ユニットは自軍沿岸(海マス)にしか配置できません"); return; }
        if (card.type === "air" && !isOwnLand) { alert("航空ユニットは自軍の陸地にしか配置できません"); return; }

        board[r][c] = { ...card, owner: currentTurn };
        hands[currentTurn].splice(selectedHandIndex, 1);
        selectedHandIndex = null;
        finishTurn();
        return;
      }

      // 【2. 移動 / 攻撃】
      if (selectedBoardPos) {
        const { r: sr, c: sc } = selectedBoardPos;
        const myUnit = board[sr][sc];
        const dist = Math.abs(sr - r) + Math.abs(sc - c);

        let maxDist = 1;
        if (myUnit.type === "sea" || myUnit.type === "air") maxDist = 2;

        if (dist > 0 && dist <= maxDist) {
          const targetUnit = board[r][c];

          // 味方ユニットがいるマスには進めない
          if (targetUnit && targetUnit.owner === currentTurn) {
            selectedBoardPos = null;
            render();
            return;
          }

          // --- 戦闘処理 ---
          if (targetUnit && targetUnit.owner !== currentTurn) {
            // 攻撃実行
            targetUnit.hp -= myUnit.atk; // 相手にダメージ
            myUnit.hp -= Math.floor(targetUnit.atk / 2); // 相手からの反撃（半分のダメージ）

            alert(`【戦闘発生！】\n敵に ${myUnit.atk} ダメージを与えました！\n(反撃で ${Math.floor(targetUnit.atk / 2)} ダメージを受けました)`);

            // 敵撃破判定
            if (targetUnit.hp <= 0) {
              alert("敵ユニットを撃破しました！");
              board[r][c] = myUnit; // 撃破して進軍
              board[sr][sc] = null;
            }

            // 自分撃破判定
            if (myUnit.hp <= 0) {
              alert("自軍ユニットが撃破されました...");
              board[sr][sc] = null;
            }
          } 
          // --- 通常移動 ---
          else {
            board[r][c] = myUnit;
            board[sr][sc] = null;
          }

          selectedBoardPos = null;
          finishTurn();
        } else {
          selectedBoardPos = null;
          render();
        }
        return;
      }

      // 【3. 選択】
      if (board[r][c] && board[r][c].owner === currentTurn) {
        selectedBoardPos = { r, c };
        selectedHandIndex = null;
        render();
      }
    }

    function finishTurn() {
      hands[currentTurn].push(getRandomCard());
      currentTurn = currentTurn === "axis" ? "allies" : "axis";
      selectedHandIndex = null;
      selectedBoardPos = null;
      render();
    }

    initGame();
  </script>
</body>
</html>
