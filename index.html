<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>大東亜戦術ボードゲーム</title>
  <style>
    /* --- CSSスタイル --- */
    body {
      font-family: sans-serif;
      background-color: #f0f2f5;
      text-align: center;
      margin: 0;
      padding: 20px;
    }

    #game-container {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 20px;
      margin-top: 20px;
    }

    #board {
      display: grid;
      grid-template-columns: repeat(8, 60px);
      grid-template-rows: repeat(8, 60px);
      gap: 2px;
      background-color: #333;
      border: 4px solid #333;
    }

    .cell {
      width: 60px;
      height: 60px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      user-select: none;
    }

    .cell.land-axis { background-color: #d4edda; }
    .cell.sea { background-color: #cce5ff; }
    .cell.land-allies { background-color: #f8d7da; }

    .cell.selected { border: 3px solid #ffc107; }

    .unit {
      padding: 2px 4px;
      border-radius: 4px;
      color: white;
      margin-top: 2px;
    }
    .unit.axis { background-color: #dc3545; }
    .unit.allies { background-color: #0d6efd; }

    #hand {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 180px;
      min-height: 200px;
      background-color: #fff;
      border: 1px solid #ccc;
      padding: 10px;
      border-radius: 8px;
    }

    .card {
      padding: 10px;
      border: 1px solid #000;
      border-radius: 6px;
      background-color: #fff8dc;
      cursor: pointer;
      font-size: 12px;
    }
    .card.selected { background-color: #ffe8a1; border-width: 2px; }

    #end-turn-btn {
      margin-top: 15px;
      padding: 10px 20px;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>大東亜戦術ボードゲーム (8x8)</h1>
  <div id="game-info">
    <p>現在のターン: <span id="current-turn">軸心国 (Axis)</span></p>
  </div>

  <div id="game-container">
    <div id="board"></div>
    <div id="controls">
      <h3>手札 (<span id="hand-owner">軸心国</span>)</h3>
      <div id="hand"></div>
      <button id="end-turn-btn">ターン終了 (ドロー)</button>
    </div>
  </div>

  <script>
    /* --- JavaScriptプログラム --- */
    const CARD_TYPES = [
      { name: "歩兵", type: "land" },
      { name: "軽戦車", type: "land" },
      { name: "中戦車", type: "land" },
      { name: "重戦車", type: "land" },
      { name: "戦艦", type: "sea" },
      { name: "戦術爆撃機", type: "air" },
      { name: "戦闘爆撃機", type: "air" }
    ];

    let currentTurn = "axis";
    let board = Array(8).fill(null).map(() => Array(8).fill(null));
    let hands = { axis: [], allies: [] };
    let selectedHandIndex = null;
    let selectedBoardPos = null;

    function initGame() {
      for (let i = 0; i < 3; i++) {
        hands.axis.push(getRandomCard());
        hands.allies.push(getRandomCard());
      }
      render();
    }

    function getRandomCard() {
      const rand = Math.floor(Math.random() * CARD_TYPES.length);
      return { ...CARD_TYPES[rand] };
    }

    function render() {
      document.getElementById("current-turn").innerText = currentTurn === "axis" ? "軸心国 (Axis)" : "連合国 (Allies)";
      document.getElementById("hand-owner").innerText = currentTurn === "axis" ? "軸心国" : "連合国";
      renderBoard();
      renderHand();
    }

    function renderBoard() {
      const boardEl = document.getElementById("board");
      boardEl.innerHTML = "";
      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const cell = document.createElement("div");
          cell.classList.add("cell");
          if (c <= 1) cell.classList.add("land-axis");
          else if (c >= 6) cell.classList.add("land-allies");
          else cell.classList.add("sea");

          if (selectedBoardPos && selectedBoardPos.r === r && selectedBoardPos.c === c) cell.classList.add("selected");

          const unit = board[r][c];
          if (unit) {
            const unitEl = document.createElement("div");
            unitEl.classList.add("unit", unit.owner);
            let name = unit.name;
            if (unit.type === "land" && c >= 2 && c <= 5) name = `輸送船(${unit.name})`;
            unitEl.innerText = name;
            cell.appendChild(unitEl);
          }
          cell.onclick = () => handleCellClick(r, c);
          boardEl.appendChild(cell);
        }
      }
    }

    function renderHand() {
      const handEl = document.getElementById("hand");
      handEl.innerHTML = "";
      hands[currentTurn].forEach((card, index) => {
        const cardEl = document.createElement("div");
        cardEl.classList.add("card");
        if (selectedHandIndex === index) cardEl.classList.add("selected");
        cardEl.innerText = `[${card.type}] ${card.name}`;
        cardEl.onclick = () => { selectedHandIndex = index; selectedBoardPos = null; render(); };
        handEl.appendChild(cardEl);
      });
    }

    function handleCellClick(r, c) {
      const isSea = (c >= 2 && c <= 5);
      const isCoast = (currentTurn === "axis" && c === 2) || (currentTurn === "allies" && c === 5);
      const isOwnLand = (currentTurn === "axis" && c <= 1) || (currentTurn === "allies" && c >= 6);

      if (selectedHandIndex !== null) {
        const card = hands[currentTurn][selectedHandIndex];
        if (board[r][c] !== null) { alert("既にユニットがいます"); return; }
        if (card.type === "land" && !isOwnLand) { alert("陸地のみ配置可能"); return; }
        if (card.type === "sea" && !isCoast) { alert("海岸のみ配置可能"); return; }

        board[r][c] = { ...card, owner: currentTurn };
        hands[currentTurn].splice(selectedHandIndex, 1);
        selectedHandIndex = null;
        render();
        return;
      }

      if (selectedBoardPos) {
        const { r: sr, c: sc } = selectedBoardPos;
        const unit = board[sr][sc];
        const dist = Math.abs(sr - r) + Math.abs(sc - c);
        const maxDist = (unit.type === "sea") ? 2 : 1;

        if (dist > 0 && dist <= maxDist) {
          board[r][c] = unit;
          board[sr][sc] = null;
          selectedBoardPos = null;
          render();
        } else {
          selectedBoardPos = null;
          render();
        }
        return;
      }

      if (board[r][c] && board[r][c].owner === currentTurn) {
        selectedBoardPos = { r, c };
        selectedHandIndex = null;
        render();
      }
    }

    document.getElementById("end-turn-btn").onclick = () => {
      hands[currentTurn].push(getRandomCard());
      currentTurn = currentTurn === "axis" ? "allies" : "axis";
      selectedHandIndex = null;
      selectedBoardPos = null;
      render();
    };

    initGame();
  </script>
</body>
</html>
