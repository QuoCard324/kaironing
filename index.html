<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>エクストリームカイロニング - Play Game</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --primary: #ff6b00;
      --accent: #38bdf8;
      --danger: #f43f5e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-color);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    h1 { margin-bottom: 10px; font-size: 1.8rem; text-align: center; color: var(--primary); }
    
    .scoreboard {
      display: flex;
      gap: 40px;
      background: var(--card-bg);
      padding: 15px 30px;
      border-radius: 12px;
      margin-bottom: 15px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
    .player-score { text-align: center; }
    .player-score .name { font-size: 0.9rem; color: #94a3b8; }
    .player-score .pts { font-size: 2rem; font-weight: bold; color: var(--accent); }

    .game-status {
      height: 30px;
      font-weight: bold;
      color: #f1f5f9;
      margin-bottom: 10px;
      text-align: center;
    }

    #gameCanvas {
      background: #1e293b;
      border: 3px solid #334155;
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .controls-hint {
      margin-top: 15px;
      display: flex;
      gap: 20px;
      max-width: 800px;
      width: 100%;
    }
    .ctrl-card {
      flex: 1;
      background: var(--card-bg);
      padding: 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      color: #cbd5e1;
    }
    .ctrl-card h3 { color: var(--primary); margin-bottom: 6px; }
    kbd {
      background: #475569;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: monospace;
    }
  </style>
</head>
<body>

  <h1>🔥 エクストリームカイロニング GAME</h1>

  <div class="scoreboard">
    <div class="player-score">
      <div class="name">1P (左)</div>
      <div class="pts" id="score1">0</div>
    </div>
    <div style="font-size: 1.5rem; align-self: center;">VS</div>
    <div class="player-score">
      <div class="name">2P (右)</div>
      <div class="pts" id="score2">0</div>
    </div>
  </div>

  <div class="game-status" id="statusText">じゃんけん中... キーを押してスタート</div>

  <canvas id="gameCanvas" width="800" height="400"></canvas>

  <div class="controls-hint">
    <div class="ctrl-card">
      <h3>1P 操作 (左側)</h3>
      <p>移動: <kbd>A</kbd> <kbd>D</kbd> (1歩のみ/戻る)</p>
      <p>ショット: <kbd>W</kbd>(ライズ) / <kbd>S</kbd>(ストレート) / <kbd>Q</kbd>(スライド)</p>
    </div>
    <div class="ctrl-card">
      <h3>2P 操作 (右側)</h3>
      <p>移動: <kbd>←</kbd> <kbd>→</kbd> (1歩のみ/戻る)</p>
      <p>ショット: <kbd>↑</kbd>(ライズ) / <kbd>↓</kbd>(ストレート) / <kbd>Shift</kbd>(スライド)</p>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // ゲーム状態
    let state = 'START'; // START, PLAYING, GAMEOVER
    let score1 = 0, score2 = 0;
    let turn = 1; // 1 or 2
    let touches = 0; // 1ターン内のレシーブ+攻撃回数 (最大5)
    let statusMsg = "スペースキーを押してじゃんけん（先攻決定）";

    // プレイヤーオブジェクト
    const p1 = { x: 100, originX: 100, y: 280, w: 30, h: 70, vx: 0, handY: 290 };
    const p2 = { x: 670, originX: 670, y: 280, w: 30, h: 70, vx: 0, handY: 290 };

    // カイロ（ボール）
    const kairo = {
      x: 100, y: 290, vx: 0, vy: 0,
      active: false, holder: 1, size: 14, type: 'normal'
    };

    // キー入力状態
    const keys = {};

    window.addEventListener('keydown', e => {
      keys[e.key] = true;

      if (state === 'START' && e.code === 'Space') {
        // じゃんけん
        turn = Math.random() < 0.5 ? 1 : 2;
        statusMsg = `じゃんけん結果: ${turn}P 先攻！`;
        resetRound(turn);
        state = 'PLAYING';
      }

      if (state === 'PLAYING') {
        handleShoot(e);
      }
    });

    window.addEventListener('keyup', e => { keys[e.key] = false; });

    function resetRound(server) {
      turn = server;
      touches = 0;
      p1.x = p1.originX;
      p2.x = p2.originX;
      kairo.active = false;
      kairo.holder = server;
      kairo.vx = 0;
      kairo.vy = 0;
      kairo.x = server === 1 ? p1.x + 20 : p2.x - 20;
      kairo.y = p1.handY;
    }

    function addScore(player) {
      if (player === 1) score1++;
      else score2++;

      document.getElementById('score1').innerText = score1;
      document.getElementById('score2').innerText = score2;

      // 勝利判定
      if ((score1 >= 5 || score2 >= 5) && Math.abs(score1 - score2) >= 2) {
        state = 'GAMEOVER';
        statusMsg = `ゲーム終了！ ${score1 > score2 ? '1P' : '2P'} の勝利！`;
      } else {
        statusMsg = `${player}P 得点！ ${player}P のサーブ`;
        resetRound(player);
      }
    }

    function handleShoot(e) {
      // 1Pのショット
      if (kairo.holder === 1) {
        // 元の位置に戻っていないと攻撃不可（一歩踏み出しルール）
        if (Math.abs(p1.x - p1.originX) > 5) return;

        if (e.key === 's' || e.key === 'S') shootKairo(1, 10, -1, 'straight');
        if (e.key === 'w' || e.key === 'W') shootKairo(1, 8, -6, 'rise'); // 膝下からライズ
        if (e.key === 'q' || e.key === 'Q') shootKairo(1, 7, -2, 'slide'); // スライド
      }

      // 2Pのショット
      if (kairo.holder === 2) {
        if (Math.abs(p2.x - p2.originX) > 5) return;

        if (e.key === 'ArrowDown') shootKairo(2, -10, -1, 'straight');
        if (e.key === 'ArrowUp') shootKairo(2, -8, -6, 'rise');
        if (e.key === 'Shift') shootKairo(2, -7, -2, 'slide');
      }
    }

    function shootKairo(player, vx, vy, type) {
      kairo.holder = 0;
      kairo.active = true;
      kairo.vx = vx;
      kairo.vy = vy;
      kairo.type = type;
      touches++;
      statusMsg = `${player}P の攻撃！ (${touches}/5タッチ)`;
    }

    function update() {
      if (state !== 'PLAYING') return;

      // 移動制限（片足1歩＝30pxまで移動可能）
      if (keys['a'] || keys['A']) p1.x = Math.max(p1.originX - 35, p1.x - 3);
      if (keys['d'] || keys['D']) p1.x = Math.min(p1.originX + 35, p1.x + 3);

      if (keys['ArrowLeft']) p2.x = Math.max(p2.originX - 35, p2.x - 3);
      if (keys['ArrowRight']) p2.x = Math.min(p2.originX + 35, p2.x + 3);

      // カイロを持ってるときは追従
      if (kairo.holder === 1) { kairo.x = p1.x + 20; kairo.y = p1.handY; }
      if (kairo.holder === 2) { kairo.x = p2.x - 20; kairo.y = p2.handY; }

      // 飛行処理
      if (kairo.active) {
        kairo.x += kairo.vx;
        kairo.y += kairo.vy;

        // 変化球処理
        if (kairo.type === 'slide') {
          kairo.vy += 0.15; // 軌道が逸れていく
        } else {
          kairo.vy += 0.25; // 通常重力
        }

        // 5タッチ制限超過
        if (touches > 5) {
          statusMsg = "5タッチ超過アウト！";
          addScore(turn === 1 ? 2 : 1);
          return;
        }

        // レシーブキャッチ判定
        let target = (kairo.vx > 0) ? p2 : p1;
        let targetNum = (kairo.vx > 0) ? 2 : 1;

        if (Math.abs(kairo.x - target.x) < 25 && Math.abs(kairo.y - target.y) < 50) {
          // 高低差チェック（腰〜頭の範囲か）
          const headY = target.y;
          const waistY = target.y + 35;

          if (kairo.y < headY || kairo.y > waistY) {
            // 反則高低差に手を出して取れなかった場合等の判定
            statusMsg = "アウト高低のカイロを無理にキャッチ！相手得点！";
            addScore(targetNum === 1 ? 2 : 1);
          } else {
            // 正常キャッチ
            kairo.active = false;
            kairo.holder = targetNum;
            turn = targetNum;
            statusMsg = `${targetNum}P キャッチ！元の位置に戻って攻撃してください。`;
          }
        }

        // 床・画面外に落ちた場合（アウト判定）
        if (kairo.y > 350 || kairo.x < 0 || kairo.x > 800) {
          // 判定：高すぎ/低すぎの場所で落ちたか
          if (kairo.y > 320) {
            statusMsg = "腰より低い位置へ落下（アウト）！";
          } else {
            statusMsg = "エリア外へ落下！";
          }
          // 最後に投げた方の反対へ得点
          addScore(kairo.vx > 0 ? 1 : 2);
        }
      }

      document.getElementById('statusText').innerText = statusMsg;
    }

    function draw() {
      // 背景
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // コート・床
      ctx.strokeStyle = '#334155';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, 350); ctx.lineTo(800, 350);
      ctx.stroke();

      // ネット（境界線）
      ctx.setLineDash([5, 5]);
      ctx.beginPath();
      ctx.moveTo(400, 100); ctx.lineTo(400, 350);
      ctx.stroke();
      ctx.setLineDash([]);

      // 1P描画
      ctx.fillStyle = '#ff6b00';
      ctx.fillRect(p1.x - p1.w/2, p1.y, p1.w, p1.h);
      // 1P足元ホーム範囲
      ctx.strokeStyle = 'rgba(255,107,0,0.3)';
      ctx.strokeRect(p1.originX - 35, 345, 70, 5);

      // 2P描画
      ctx.fillStyle = '#38bdf8';
      ctx.fillRect(p2.x - p2.w/2, p2.y, p2.w, p2.h);
      // 2P足元ホーム範囲
      ctx.strokeStyle = 'rgba(56,189,248,0.3)';
      ctx.strokeRect(p2.originX - 35, 345, 70, 5);

      // カイロ描画
      ctx.fillStyle = '#f43f5e';
      ctx.beginPath();
      ctx.arc(kairo.x, kairo.y, kairo.size, 0, Math.PI * 2);
      ctx.fill();

      // カイロの「温もり」オーラ
      ctx.strokeStyle = 'rgba(244, 63, 94, 0.4)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(kairo.x, kairo.y, kairo.size + 4, 0, Math.PI * 2);
      ctx.stroke();
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
